
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy 1 Year ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 overflow:hidden;font-family:monospace;
 background:radial-gradient(#fff8ef,#fbd9e5);
 color:#853653;
}
.hearts{position:fixed;inset:0;pointer-events:none}
.heart{
 position:absolute;bottom:-30px;color:#e86c96;
 animation:float 8s linear infinite;
}
@keyframes float{
 to{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
.card{
 width:min(88%,370px);text-align:center;
 background-color:#f6c4d5;
 background-image:linear-gradient(90deg,#ffffff44 50%,transparent 50%),
 linear-gradient(#ffffff44 50%,transparent 50%);
 background-size:18px 18px;
 border:4px solid #cb718f;border-radius:12px;
 box-shadow:0 15px 35px #b95d7b44;overflow:hidden;
}
.top{
 background:#eea1bb;padding:12px;text-align:left;
 border-bottom:3px solid #cb718f;font-weight:bold;
}
.bar{padding:10px;background:#fff0f4;color:#d33468}
.content{padding:20px 14px}
h2{font-size:20px;line-height:1.5}
.cat{font-size:90px;margin:12px}
button{
 padding:12px 23px;border:3px solid #d77a98;
 border-radius:8px;background:#fff5f7;color:#9e3559;
 font:bold 16px monospace;box-shadow:0 4px #d77a98;
}
#yes{background:#fff5f7}
#no{position:relative}
#final{display:none}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="card">
 <div class="top">LOVE　　－　□　×</div>
 <div class="bar">♥ · ♥ · ♥</div>
 <div class="content" id="question">
  <h2>Happy 1 year, my love ♡<br>Still love me?</h2>
  <div class="cat">🐈‍⬛💗</div>
  <button id="no">NO</button>
  <button id="yes">YES</button>
 </div>
 <div class="content" id="final">
  <h2>Yayyy! I love you ♡</h2>
  <div class="cat">🐈‍⬛💕</div>
  <p>One year of relationship, a lifetime to go. Happy anniversary, my love ❤️</p>
  <h2>Forever & Always ♡</h2>
 </div>
</div>
<script>
const hearts=document.getElementById('hearts');
for(let i=0;i<30;i++){
 const h=document.createElement('span');
 h.className='heart';
 h.textContent='♥';
 h.style.left=Math.random()*100+'%';
 h.style.animationDelay=Math.random()*8+'s';
 h.style.fontSize=(12+Math.random()*18)+'px';
 hearts.appendChild(h);
}
const no=document.getElementById('no');
no.addEventListener('pointerenter',()=>{
 no.style.transform=`translate(${Math.random()*100-50}px,${Math.random()*60-30}px)`;
});
no.addEventListener('click',()=>{
 no.style.transform=`translate(${Math.random()*100-50}px,${Math.random()*60-30}px)`;
});
document.getElementById('yes').onclick=()=>{
 document.getElementById('question').style.display='none';
 document.getElementById('final').style.display='block';
};
</script>
</body>
</html>
